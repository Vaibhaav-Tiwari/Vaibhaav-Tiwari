name: Refresh live profile activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.py"
      - "assets/art.txt"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate profile with live GitHub activity
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          PROFILE_USER: Vaibhaav-Tiwari
        run: python scripts/update_profile.py

      - name: Commit refreshed activity when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/dark_mode.svg assets/light_mode.svg cache/loc_cache.txt
          git diff --staged --quiet || git commit -m "chore: refresh live profile activity"
          git push
